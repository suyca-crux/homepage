name: Lint Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Setup npmrc for GitHub Packages
        run: |
          echo "@vipelar:registry=https://npm.pkg.github.com" >> ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.VIPELAR_PACKAGES_TOKEN }}" >> ~/.npmrc

      - run: pnpm install
      - run: pnpm lint
      - run: pnpm prettier
